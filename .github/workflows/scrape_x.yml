name: Refresh X List M3U Playlist

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: Run Scraper Script
      run: python x_list_to_m3u.py

    - name: Commit and Push updated M3U file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add x_video_playlist.m3u
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No new changes detected in the playlist file. Exiting cleanly."
          exit 0
        else
          git commit -m "Automated update of X video playlist"
          git push
        fi
