name: Refresh X List M3U Playlist

on:
  schedule:
    # This runs the script every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # This adds a manual "Run now" button in the GitHub dashboard for testing

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: Run Scraper Script
      run: python x_list_to_m3u.py

    - name: Commit and Push updated M3U file
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add x_video_playlist.m3u
        # Only commit if the file actually changed to avoid empty errors
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of X video playlist" && git push)
